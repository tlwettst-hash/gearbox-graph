<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gearbox Graph</title>
<style>
  :root { --bg:#17191b; --panel:#222528ee; --ink:#e8e6e1; --dim:#9a9d9f; --line:#3a3e42; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow:hidden; }
  canvas { display:block; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  #panel { position:fixed; top:12px; left:12px; width:250px; max-height:calc(100% - 24px); overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  h1 { font-size:15px; margin:0 0 2px; letter-spacing:.2px; cursor:pointer; user-select:none; }
  h1::after { content:' ▾'; color:var(--dim); }
  #panel.min h1::after { content:' ▸'; }
  #panel.min > :not(h1) { display:none; }
  #panel.min { width:auto; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; margin-bottom:10px; }
  .seg button { flex:1; background:transparent; color:var(--dim); border:0; padding:6px 0; font:inherit; cursor:pointer; }
  .seg button.on { background:#3a3e42; color:var(--ink); }
  input[type=search] { width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--line);
    background:#15171a; color:var(--ink); font:inherit; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; user-select:none; }
  .row.off { opacity:.35; }
  .sw { width:16px; height:12px; border-radius:2px; flex:none; box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); }
  .row .n { margin-left:auto; color:var(--dim); font-variant-numeric: tabular-nums; }
  .sep { border-top:1px solid var(--line); margin:10px 0; }
  label.chk { display:flex; gap:8px; align-items:center; cursor:pointer; margin-bottom:4px; }
  .sizes { color:var(--dim); font-size:12px; margin-top:8px; }
  #tip { position:fixed; pointer-events:none; background:#0e0f10f0; border:1px solid var(--line);
    border-radius:8px; padding:7px 9px; max-width:340px; display:none; }
  #tip b { display:block; } #tip span { color:var(--dim); font-size:12px; word-break:break-all; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1 id="ttl">Gearbox Graph</h1>
  <div class="sub" id="stats"></div>
  <div class="seg"><button id="mGears" class="on">Gears</button><button id="mBrick">Bricks</button></div>
  <div class="seg"><button id="lMach" class="on">Machine</button><button id="lProj">By project</button><button id="lWeb">Web</button></div>
  <input type="search" id="q" placeholder="Find a note…">
  <div id="legend"></div>
  <div class="sep"></div>
  <label class="chk"><input type="checkbox" id="orph"> Show loose parts (unlinked notes)</label>
  <label class="chk" id="allRow"><input type="checkbox" id="all"> Show every link (rubber bands)</label>
  <label class="chk" id="spinRow"><input type="checkbox" id="spin" checked> Spin the gears</label>
  <div class="sizes" id="sizes"></div>
  <div class="sizes">Drag to pan · drag a gear to crank it · scroll to zoom · click a part to open it in Obsidian</div>
</div>
<div id="tip"></div>
<script>
const DATA = /*__DATA__*/null;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const U = 10; // one stud / one beam-hole pitch, in world units
const TAU = Math.PI*2;
const INDEX_RE = /(^|[\s_-])index$/i;   // notes named "...Index", e.g. "Projects-INDEX" or "Reading index"
let W, H, DPR;
function resize(){ DPR = window.devicePixelRatio||1; W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px'; kick(); }

// ---- nodes: pick a brick and a machine part for each note by link count ----
const N = DATA.nodes.map((n,i)=>({...n, i, deg:0, x:0, y:0, vx:0, vy:0, nb:[], dir:1}));
for (const [a,b] of DATA.edges){ N[a].deg++; N[b].deg++; N[a].nb.push(b); N[b].nb.push(a); }
for (const n of N){
  const d = n.deg;
  // brick
  if (d===0){ n.cols=1; n.rows=1; n.round=true; }
  else if (d<=3){ n.cols=2; n.rows=1; }
  else if (d<=11){ n.cols=2; n.rows=2; }
  else { n.cols=4; n.rows=2; }
  n.w = n.cols*U; n.h = n.rows*U;
  // gears mode: a machine part, shaped by how the note is linked
  if (d===0) n.part = 'pin';
  else if (INDEX_RE.test(n.t)) n.part = 'turn';           // index notes: everything pivots on them
  else if (d===1){ n.part = 'beam'; n.holes = 3; }        // 3-hole beam, pointing at its one link
  else if (d===2) n.part = 'conn';                        // angled connector, snapped to the angle of its links
  else if (d===3) n.part = 'tee';                         // T-shaped beam 3x3
  else if (d<=5) n.part = 'hub';                          // axle connector hub with 4 bars
  else { n.part = 'gear'; n.T = d<=11 ? 16 : d<=19 ? 24 : d<=39 ? 40 : 64; n.R = n.T/16*1.5*U; }
  n.tr = { gear: (n.R||0)+0.3*U, beam: 1.5*U, conn: 1.6*U, tee: 2.6*U, hub: 1.6*U, turn: 4.25*U, pin: U }[n.part];
  n.r = Math.max(n.tr, Math.hypot(n.w,n.h)/2);                               // layout radius fits both
  n.color = DATA.groups[n.g].color;
}
const linked = N.filter(n=>n.deg>0), loose = N.filter(n=>n.deg===0);
// Neighbouring gears turn opposite ways: 2-colour the graph breadth-first.
{ const seen = new Set();
  for (const s of linked){ if (seen.has(s.i)) continue; seen.add(s.i); const q = [s];
    while (q.length){ const n = q.shift();
      for (const j of n.nb) if (!seen.has(j)){ seen.add(j); N[j].dir = -n.dir; q.push(N[j]); } } } }
const groupOn = Object.fromEntries(Object.keys(DATA.groups).map(k=>[k,true]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let mode = 'gears', spin = !reduceMotion, showLoose = false, query = '', hover = null;
document.getElementById('spin').checked = spin;

// ---- machine layout: one real gear train, every other part on a straight axle ----
// Gears mesh along a spanning tree of the gear-to-gear links: centre distance = sum of pitch radii,
// speed ratio = tooth ratio, tooth phase set so teeth sit in gaps. The other parts plug into gears on
// axles, spread evenly round each gear's open side. Links left out of the tree are rubber bands, shown on demand.
let layout = 'machine', showAll = false;
const key = (a,b)=> a<b ? a+','+b : b+','+a;
let tree = new Set(), meshed = new Set(), labels = [];
const angDiff = (a,b)=>{ const d = Math.abs(((a-b)%TAU+TAU)%TAU); return Math.min(d, TAU-d); };
function segDist(px,py,x1,y1,x2,y2){ const dx = x2-x1, dy = y2-y1, L2 = dx*dx+dy*dy||1;
  const k = Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/L2)); return Math.hypot(px-x1-k*dx, py-y1-k*dy); }
// shelf-pack boxes {w,h} left to right in rows no wider than maxW; sets b.px, b.py, returns [width, height]
function shelf(boxes, gap, maxW){ let x = 0, y = 0, rowH = 0, W = 0;
  for (const b of boxes){ if (x > 0 && x + b.w > maxW){ x = 0; y += rowH + gap; rowH = 0; }
    b.px = x; b.py = y; x += b.w + gap; rowH = Math.max(rowH, b.h); W = Math.max(W, b.px + b.w); }
  return [W, y + rowH]; }
// perProject: only links inside a project group build a machine, one table-full of separate builds;
// links between projects become rubber bands. Returns the build so the page can switch between them.
function machineLayout(perProject){
  tree = new Set(); meshed = new Set(); labels = [];
  const nbOf = n => perProject ? n.nb.filter(j=>N[j].g===n.g) : n.nb;
  for (const n of N){ n.tp = null; n.tnb = []; n.done = false; n.out = null; }
  const comps = [], seen = new Set();
  for (const s of linked){ if (seen.has(s.i)) continue; seen.add(s.i); const c = [s];
    for (let k=0;k<c.length;k++) for (const j of nbOf(c[k])) if (!seen.has(j)){ seen.add(j); c.push(N[j]); }
    comps.push(c); }
  comps.sort((a,b)=>b.length-a.length);
  let shiftX = null;
  for (const comp of comps){
    const placed = [];
    const free = (x,y,r,p,thru)=>{ for (const m of placed){ if (m===p) continue; const need = r+m.r+2;
        if ((x-m.x)**2+(y-m.y)**2 < need*need) return false;
        if (p && !thru && segDist(m.x,m.y,p.x,p.y,x,y) < m.r*0.8) return false; }   // the axle can't run through a part
      return true; };
    const put = (n,x,y,p,mesh)=>{ n.x = x; n.y = y; n.done = true; placed.push(n);
      if (!p) return; n.tp = p; n.out = Math.atan2(y-p.y, x-p.x); n.tnb.push(p.i); p.tnb.push(n.i);
      tree.add(key(n.i,p.i)); if (mesh) meshed.add(key(n.i,p.i)); };
    const pref = (p,k,cnt)=> p.out==null ? k*TAU/cnt : p.out + ((k+.5)/cnt-.5)*Math.PI;  // fan children outward
    const tryMesh = (c,p,want)=>{ const D = p.R+c.R; let best = null, bs = Infinity;
      for (let k=0;k<72;k++){ const a = k*TAU/72, x = p.x+Math.cos(a)*D, y = p.y+Math.sin(a)*D, sc = angDiff(a,want);
        if (sc < bs && free(x,y,c.r,p)){ best = [x,y]; bs = sc; } }
      return best; };
    // shortest whole-stud axle near the wanted direction; if every route crosses a part, allow crossing
    const tryAxle = (c,p,want,dirs,thru)=>{ const L0 = Math.ceil((p.r+c.r+U)/U)*U, lpk = dirs > 16 ? 0.05 : 0.12;
      let best = null, bs = Infinity;
      for (let L=L0; L<L0+40*U; L+=U){ const lp = (L-L0)/U*lpk; if (lp >= bs) break;
        for (let k=0;k<dirs;k++){ const a = k*TAU/dirs, sc = angDiff(a,want)+lp; if (sc >= bs) continue;
          const x = p.x+Math.cos(a)*L, y = p.y+Math.sin(a)*L; if (free(x,y,c.r,p,thru)){ best = [x,y]; bs = sc; } } }
      return best || (thru ? [p.x+Math.cos(want)*(L0+40*U), p.y+Math.sin(want)*(L0+40*U)] : tryAxle(c,p,want,dirs,true)); };
    const byDeg = (a,b)=>b.deg-a.deg || a.i-b.i;
    const root = comp.filter(c=>c.part==='gear').sort(byDeg)[0] || [...comp].sort(byDeg)[0]; put(root,0,0,null,false);
    // 1. the gear train, breadth-first from the busiest gear, meshes only
    if (root.part==='gear') for (let q=0; q<placed.length; q++){ const p = placed[q];
      const kids = nbOf(p).map(j=>N[j]).filter(c=>c.part==='gear' && !c.done).sort(byDeg);
      kids.forEach((c,k)=>{ const at = tryMesh(c,p,pref(p,k,kids.length)); if (at) put(c,at[0],at[1],p,true); }); }
    // 2. parts that plug straight into gears. One linked to several gears goes to the gear with the most
    // open room; each gear's parts sit on evenly spaced spokes across its open arc, sorted by project.
    const gears = placed.filter(g=>g.part==='gear');
    for (const g of gears){ g.openA = []; g.load = [];
      for (let k=0;k<72;k++){ const a = k*TAU/72, x = g.x+Math.cos(a)*(g.R+4*U), y = g.y+Math.sin(a)*(g.R+4*U);
        if (free(x,y,1.5*U,g)) g.openA.push(a); } }
    const plug = comp.filter(c=>!c.done && nbOf(c).some(j=>N[j].done && N[j].part==='gear'))
      .map(c=>[c, nbOf(c).map(j=>N[j]).filter(g=>g.done && g.part==='gear')]).sort((a,b)=>a[1].length-b[1].length || byDeg(a[0],b[0]));
    for (const [c,hosts] of plug){ let h = hosts[0], hs = Infinity;
      for (const g of hosts){ const sc = (g.load.length+1)/(g.openA.length+1); if (sc < hs){ hs = sc; h = g; } }
      h.load.push(c); }
    for (const g of [...gears].sort((a,b)=>b.load.length-a.load.length)){
      const P = g.load.sort((a,b)=>a.g.localeCompare(b.g) || b.deg-a.deg || a.t.localeCompare(b.t)), A = g.openA.length ? g.openA : [0];
      let s0 = 0; for (let k=0;k<A.length;k++) if (angDiff(A[k], A[(k+1)%A.length]) > TAU/72*1.5){ s0 = (k+1)%A.length; break; } // start at a gap
      P.forEach((c,k)=>{ const want = A[(s0 + Math.floor((k+.5)*A.length/P.length)) % A.length];
        const [x,y] = tryAxle(c,g,want,144); put(c,x,y,g,false); }); }
    // 3. everything left, breadth-first: gears that couldn't mesh above, and parts linked only to parts
    for (let q=0; q<placed.length; q++){ const p = placed[q];
      const kids = nbOf(p).map(j=>N[j]).filter(c=>!c.done).sort(byDeg);
      kids.forEach((c,k)=>{ const want = pref(p,k,kids.length);
        const at = c.part==='gear' && p.part==='gear' ? tryMesh(c,p,want) : null;
        if (at) put(c,at[0],at[1],p,true); else { const [x,y] = tryAxle(c,p,want,16); put(c,x,y,p,false); } }); }
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for (const n of comp){ x0=Math.min(x0,n.x-n.r); y0=Math.min(y0,n.y-n.r); x1=Math.max(x1,n.x+n.r); y1=Math.max(y1,n.y+n.r); }
    comp.box = {x0, y0, w:x1-x0, h:y1-y0};
    if (perProject) continue;
    // small separate machines go in a row to the right of the big one
    if (shiftX===null) shiftX = x1 + 6*U; else { for (const n of comp){ n.x += shiftX-x0; n.y += -y0; } shiftX += x1-x0 + 6*U; }
  }
  if (perProject){ // each project's machines packed into a block under its name, the blocks packed onto the table
    const byG = new Map(); for (const c of comps){ const g = c[0].g; (byG.get(g) || byG.set(g,[]).get(g)).push(c); }
    const blocks = [];
    for (const [g,cs] of byG){ const boxes = cs.map(c=>({c, w:c.box.w, h:c.box.h}));
      const area = boxes.reduce((s,b)=>s+b.w*b.h, 0);
      const [bw,bh] = shelf(boxes, 4*U, Math.max(boxes[0].w, Math.sqrt(area)*1.4));
      blocks.push({g, boxes, w:Math.max(bw, DATA.groups[g].label.length*2.6*U), h:bh + 8*U}); }   // room for the name
    blocks.sort((a,b)=>b.w*b.h-a.w*a.h);
    const total = blocks.reduce((s,b)=>s+b.w*b.h, 0);
    shelf(blocks, 16*U, Math.max(blocks[0].w, Math.sqrt(total)*1.6));
    for (const bl of blocks){ labels.push({g:bl.g, x:bl.px, y:bl.py + 5*U, w:bl.w});
      for (const b of bl.boxes){ const dx = bl.px + b.px - b.c.box.x0, dy = bl.py + 8*U + b.py - b.c.box.y0;
        for (const n of b.c){ n.x += dx; n.y += dy; } } } }
  // gear speeds and tooth phases, parent before child
  const order = linked.filter(n=>n.part==='gear').sort((a,b)=>treeDepth(a)-treeDepth(b));
  for (const n of order){ const p = n.tp;
    if (p && meshed.has(key(n.i,p.i))){ const th = Math.atan2(n.y-p.y, n.x-p.x);
      n.w = -p.w*p.T/n.T; n.ph = -p.ph*p.T/n.T + th*p.T/n.T + th + Math.PI - Math.PI/n.T; }
    else { n.w = n.dir*0.00035*24/n.T; n.ph = 0; } }   // a gear on an axle drives its own little train
  // trains: gears joined by meshes turn together, so cranking one turns the rest
  for (const n of linked) n.train = null;
  for (const s of linked){ if (s.part!=='gear' || s.train) continue; const tr = [s]; s.train = tr;
    for (let k=0;k<tr.length;k++) for (const j of tr[k].tnb) if (!N[j].train && meshed.has(key(j,tr[k].i))){ N[j].train = tr; tr.push(N[j]); } }
  return { tree, meshed, labels, nodes: linked.map(n=>[n.x,n.y,n.tp,n.tnb,n.out,n.w,n.ph,n.train]) };
}
function treeDepth(n){ let d = 0; while (n.tp){ n = n.tp; d++; } return d; }
function useBuild(b){ tree = b.tree; meshed = b.meshed; labels = b.labels;
  linked.forEach((n,k)=>{ [n.x,n.y,n.tp,n.tnb,n.out,n.w,n.ph,n.train] = b.nodes[k]; n.ck = 0; }); }
const BUILDS = { projects: machineLayout(true), machine: machineLayout(false) };
for (const n of N) n.ck = 0;   // hand-crank offset, radians
function initWeb(){ // force layout start: a sunflower spiral
  const R = Math.sqrt(linked.length)*40;
  linked.forEach((n,k)=>{ const a = k*2.39996, r = R*Math.sqrt((k+.5)/linked.length);
    n.x = Math.cos(a)*r; n.y = Math.sin(a)*r; n.vx = n.vy = 0; }); }
// ---- web layout (smooth-cutoff grid repulsion + springs + gravity) ----
let alpha = 0;
function tick(){
  const CELL = 150, grid = new Map();
  for (const n of linked){ const k = Math.floor(n.x/CELL)+','+Math.floor(n.y/CELL);
    (grid.get(k)||grid.set(k,[]).get(k)).push(n); }
  for (const n of linked){
    const cx = Math.floor(n.x/CELL), cy = Math.floor(n.y/CELL);
    for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++){
      const cell = grid.get((cx+dx)+','+(cy+dy)); if (!cell) continue;
      for (const m of cell){ if (m.i<=n.i) continue;
        let ex = n.x-m.x, ey = n.y-m.y, d2 = ex*ex+ey*ey;
        if (d2 < 1e-4){ ex = Math.random()-.5; ey = Math.random()-.5; d2 = .5; }
        if (d2 >= CELL*CELL) continue;
        const d = Math.sqrt(d2), min = n.r+m.r+6;
        let f = 400*(1/d2 - 1/(CELL*CELL));    // repulsion that fades to zero at CELL
        if (d < min) f += (min-d)/d*0.5;       // collision: parts don't overlap
        n.vx += ex*f; n.vy += ey*f; m.vx -= ex*f; m.vy -= ey*f; } }
  }
  for (const [a,b] of DATA.edges){ const n = N[a], m = N[b];
    const ex = m.x-n.x, ey = m.y-n.y, d = Math.hypot(ex,ey)||1, L = 30+n.r+m.r;
    const f = (d-L)/d*0.04; n.vx += ex*f; n.vy += ey*f; m.vx -= ex*f; m.vy -= ey*f; }
  for (const n of linked){ n.vx -= n.x*0.006; n.vy -= n.y*0.006;
    n.x += n.vx*alpha; n.y += n.vy*alpha; n.vx *= .55; n.vy *= .55; }
  alpha = Math.max(0, alpha-0.0035);
}
function layoutLoose(){ // neat parts bin under the graph
  let maxY = -Infinity, minX = Infinity, maxX = -Infinity;
  for (const n of linked){ maxY = Math.max(maxY,n.y+n.r); minX = Math.min(minX,n.x); maxX = Math.max(maxX,n.x); }
  const dx = mode==='gears' ? U*2.6 : U*1.6, dy = mode==='gears' ? U*1.4 : U*1.6;
  const per = Math.max(10, Math.floor((maxX-minX)/dx));
  const sorted = [...loose].sort((a,b)=>a.g.localeCompare(b.g)||a.t.localeCompare(b.t));
  sorted.forEach((n,k)=>{ n.x = minX + (k%per)*dx; n.y = maxY + 80 + Math.floor(k/per)*dy; });
}

// ---- camera ----
let cam = {x:0, y:0, s:1};
function fit(){ const vis = visible(); if (!vis.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const n of vis){ x0=Math.min(x0,n.x-n.r); y0=Math.min(y0,n.y-n.r); x1=Math.max(x1,n.x+n.r); y1=Math.max(y1,n.y+n.r); }
  if (layout==='projects') for (const L of labels) if (groupOn[L.g]){ x0=Math.min(x0,L.x); y0=Math.min(y0,L.y-5*U); x1=Math.max(x1,L.x+L.w); }
  const padL = panel.classList.contains('min') ? 20 : 280;
  cam.s = Math.min((W-padL-40)/(x1-x0+20), (H-40)/(y1-y0+20));
  cam.x = (x0+x1)/2 - (padL/2)/cam.s; cam.y = (y0+y1)/2; }
const toScreen = (x,y)=>[(x-cam.x)*cam.s+W/2, (y-cam.y)*cam.s+H/2];
const toWorld = (sx,sy)=>[(sx-W/2)/cam.s+cam.x, (sy-H/2)/cam.s+cam.y];

// ---- drawing helpers ----
function shade(hex, amt){ const v = parseInt(hex.slice(1),16);
  const c = [v>>16, v>>8&255, v&255].map(x=>Math.max(0,Math.min(255,Math.round(x+amt))));
  return `rgb(${c})`; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
const HOLE = '#0d0e0f';
function onScreen(cx,cy,r){ return !(cx+r < 0 || cx-r > W || cy+r < 0 || cy-r > H); }

// ---- classic brick ----
function brick(n){
  const s = cam.s, [cx,cy] = toScreen(n.x,n.y), w = n.w*s, h = n.h*s, x = cx-w/2, y = cy-h/2;
  if (!onScreen(cx,cy,Math.max(w,h))) return;
  const base = n.color, u = U*s, depth = Math.max(1, u*0.18);

let running = false;
function frame(t){
  if (layout==='web' && alpha > 0){ for (let i=0;i<3;i++) tick(); if (alpha > 0.6) fit(); if (alpha === 0) fit(); }
  draw(t);
  if ((layout==='web' && alpha > 0) || (mode==='gears' && spin)) requestAnimationFrame(frame); else running = false;
}
function kick(){ if (!running){ running = true; requestAnimationFrame(frame); } }

// ---- panel ----
const panel = document.getElementById('panel');
if (innerWidth < 700) panel.classList.add('min');
panel.querySelector('h1').onclick = ()=>panel.classList.toggle('min');
const legend = document.getElementById('legend');
const counts = {}; for (const n of N) counts[n.g] = (counts[n.g]||0)+1;
for (const [k,g] of Object.entries(DATA.groups)){ if (!counts[k]) continue;
  const row = document.createElement('div'); row.className = 'row';
  const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = g.color;
  const lb = document.createElement('span'); lb.textContent = g.label;
  const ct = document.createElement('span'); ct.className = 'n'; ct.textContent = counts[k];
  row.append(sw, lb, ct);
  row.onclick = ()=>{ groupOn[k] = !groupOn[k]; row.classList.toggle('off', !groupOn[k]); kick(); };
  legend.append(row); }
function updateStats(){ document.getElementById('stats').textContent =
  `${N.length} notes · ${DATA.edges.length} links · ${loose.length} unlinked` + (layout==='web' ? '' : ` · ${meshed.size} gear meshes`); }
const SIZES = {
  gears: 'Part = link count:<br>64-tooth gear (40+) · 40T (20–39) · 24T (12–19) · 16T (6–11)<br>' +
    '4-bar hub (4–5) · T-beam (3) · angled connector, snapped to the links\' angle (2) · 3-hole beam (1) · pin (none)<br>' +
    'Index notes are turntables.<br>Links are axles; in Web and Machine, links between project groups get a universal joint.<br>' +
    'Machine layout: gears linked to gears really mesh (one tree of them); every other part rides an axle. Links outside that tree are red rubber bands, shown on hover or with the checkbox.<br>' +
    'By project: one machine per project group, side by side; links between projects are rubber bands.<br>Drag a gear to crank it: its whole train turns at the tooth ratios.',
  bricks: 'Brick size = link count:<br>2×4 hub (12+) · 2×2 (4–11) · 1×2 (1–3) · round 1×1 (none)' };
function setMode(m){ mode = m;
  document.getElementById('mGears').classList.toggle('on', m==='gears');
  document.getElementById('mBrick').classList.toggle('on', m==='bricks');
  document.getElementById('sizes').innerHTML = SIZES[m];   // static strings above, no note data
  document.getElementById('spinRow').style.display = m==='gears' ? '' : 'none';
  document.getElementById('ttl').textContent = m==='gears' ? 'Gearbox Graph' : 'Brick Graph';
  if (showLoose) layoutLoose(); kick(); }
document.getElementById('mGears').onclick = ()=>setMode('gears');
document.getElementById('mBrick').onclick = ()=>setMode('bricks');
function setLayout(l){ layout = l;
  for (const [id,v] of [['lMach','machine'],['lProj','projects'],['lWeb','web']]) document.getElementById(id).classList.toggle('on', l===v);
  document.getElementById('allRow').style.display = l==='web' ? 'none' : '';
  if (l==='web'){ initWeb(); alpha = 1; } else { useBuild(BUILDS[l]); alpha = 0; }
  updateStats(); if (showLoose) layoutLoose(); fit(); kick(); }
document.getElementById('lMach').onclick = ()=>setLayout('machine');
document.getElementById('lProj').onclick = ()=>setLayout('projects');
document.getElementById('lWeb').onclick = ()=>setLayout('web');
document.getElementById('all').onchange = e=>{ showAll = e.target.checked; kick(); };
document.getElementById('spin').onchange = e=>{ spin = e.target.checked; kick(); };
document.getElementById('orph').onchange = e=>{ showLoose = e.target.checked; layoutLoose(); fit(); kick(); };
document.getElementById('q').oninput = e=>{ query = e.target.value.trim().toLowerCase(); kick(); };

// ---- interaction ----
const tip = document.getElementById('tip');
let drag = null, crank = null, moved = false;
const openNote = n=>{ location.href = 'obsidian://open?vault='+encodeURIComponent(DATA.vault)+'&file='+encodeURIComponent(n.p.replace(/\.md$/,'')); };
function hit(n, wx, wy){
  const pad = 3/cam.s, dx = wx-n.x, dy = wy-n.y;
  if (mode==='bricks') return Math.abs(dx) <= n.w/2+pad && Math.abs(dy) <= n.h/2+pad;
  if (n.part==='gear') return Math.hypot(dx,dy) <= n.tr+pad;
  if (n.part==='conn' || n.part==='hub') return Math.hypot(dx,dy) <= 1.5*U+pad;
  if (n.part==='turn') return Math.abs(dx) <= 3*U+pad && Math.abs(dy) <= 3*U+pad;
  const ang = n.part==='pin' ? 0 : (n.ang ?? (n.part==='tee' ? teeAngle(n) : beamAngle(n)));
  const along = dx*Math.cos(ang)+dy*Math.sin(ang), across = -dx*Math.sin(ang)+dy*Math.cos(ang);
  if (n.part==='tee') return TEE_HOLES.some(([hx,hy])=>Math.hypot(along-hx*U, across-hy*U) <= .65*U+pad);
  const [L,Wd] = n.part==='beam' ? [n.holes*U,U] : [2*U,U];
  return Math.abs(along) <= L/2+pad && Math.abs(across) <= Wd/2+pad; }
function pick(sx,sy){ const [wx,wy] = toWorld(sx,sy); let best = null, bd = Infinity;
  for (const n of visible()) if (hit(n,wx,wy)){ const d = Math.hypot(wx-n.x, wy-n.y); if (d<bd){ bd=d; best=n; } }
  return best; }
cv.onmousedown = e=>{ moved = false; cv.classList.add('dragging');
  const g = mode==='gears' && layout!=='web' ? pick(e.clientX,e.clientY) : null;
  if (g && g.part==='gear'){ const [wx,wy] = toWorld(e.clientX,e.clientY);   // grab a gear: crank it
    crank = {g, a:Math.atan2(wy-g.y, wx-g.x), x:e.clientX, y:e.clientY}; return; }
  drag = {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y}; };
addEventListener('mouseup', e=>{ cv.classList.remove('dragging');
  if ((drag || crank) && !moved){ const n = pick(e.clientX,e.clientY); if (n) openNote(n); }
  drag = null; crank = null; });
addEventListener('mousemove', e=>{
  if (crank){ if (Math.abs(e.clientX-crank.x)+Math.abs(e.clientY-crank.y) > 3) moved = true;
    const g = crank.g, [wx,wy] = toWorld(e.clientX,e.clientY), a = Math.atan2(wy-g.y, wx-g.x);
    const d = ((a-crank.a+Math.PI)%TAU+TAU)%TAU - Math.PI; crank.a = a;
    for (const h of g.train) h.ck += d*h.w/g.w;   // meshed gears keep their phase relation: ratio = speed ratio
    kick(); return; }
  if (drag){ const dx = e.clientX-drag.x, dy = e.clientY-drag.y; if (Math.abs(dx)+Math.abs(dy) > 3) moved = true;
    cam.x = drag.cx - dx/cam.s; cam.y = drag.cy - dy/cam.s; kick(); return; }
  if (e.target !== cv) return;
  const n = pick(e.clientX,e.clientY);
  if (n !== hover){ hover = n; kick(); }
  if (n){ tip.style.display = 'block';
    tip.replaceChildren(Object.assign(document.createElement('b'),{textContent:n.t}),
      Object.assign(document.createElement('span'),{textContent:`${DATA.groups[n.g].label} · ${n.deg} links`}),
      document.createElement('br'),
      ...(mode==='gears' ? [Object.assign(document.createElement('span'),{textContent:partName(n)}), document.createElement('br')] : []),
      Object.assign(document.createElement('span'),{textContent:n.p}));
    tip.style.left = Math.min(e.clientX+14, W-350)+'px'; tip.style.top = (e.clientY+14)+'px'; }
  else tip.style.display = 'none';
});
cv.onmouseleave = ()=>{ hover = null; tip.style.display = 'none'; kick(); };
cv.addEventListener('wheel', e=>{ e.preventDefault();
  const [wx,wy] = toWorld(e.clientX,e.clientY), k = Math.exp(-e.deltaY*0.0015);
  cam.s = Math.min(12, Math.max(0.05, cam.s*k));
  cam.x = wx - (e.clientX-W/2)/cam.s; cam.y = wy - (e.clientY-H/2)/cam.s; kick(); }, {passive:false});
addEventListener('resize', resize);

// ---- go ----
setMode('gears');
resize(); setLayout('machine');
</script>
</body>
</html>
